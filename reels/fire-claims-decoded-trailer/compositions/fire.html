<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #0b0908;
    }
    #fire-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
  </style>
  <div id="root" data-composition-id="fire" data-width="1080" data-height="1920" data-duration="31.5">
    <canvas id="fire-canvas" width="540" height="960"></canvas>
  </div>
  <script>
    (function () {
      // The fire's shape over the film, one row per key: [time s, flame height (share of frame),
      // heat 0-1, smoke 0-1, embers 0-1]. Values between keys are interpolated linearly.
      const KEYS = [
        [0.0, 0.95, 1.0, 0.25, 0.9],
        [2.9, 0.85, 1.0, 0.3, 0.9],
        [3.05, 0.2, 0.85, 0.35, 0.5],
        [4.6, 0.22, 0.85, 0.35, 0.5],
        [4.95, 0.55, 1.0, 0.35, 0.7],
        [5.05, 0.2, 0.85, 0.35, 0.5],
        [6.6, 0.22, 0.85, 0.35, 0.5],
        [6.95, 0.55, 1.0, 0.35, 0.7],
        [7.05, 0.2, 0.85, 0.35, 0.5],
        [8.6, 0.25, 0.85, 0.35, 0.5],
        [8.95, 0.6, 1.0, 0.4, 0.8],
        [9.05, 0.16, 0.7, 0.5, 0.35],
        [10.7, 0.3, 0.8, 0.5, 0.5],
        [11.0, 1.35, 1.0, 0.4, 1.0],
        [12.9, 1.2, 1.0, 0.45, 1.0],
        [13.05, 0.55, 1.0, 0.35, 0.8],
        [15.0, 0.4, 0.95, 0.35, 0.7],
        [19.0, 0.38, 0.9, 0.35, 0.7],
        [21.0, 0.5, 0.95, 0.35, 0.8],
        [21.2, 0.9, 1.0, 0.35, 1.0],
        [21.95, 0.85, 1.0, 0.4, 1.0],
        [22.6, 0.12, 0.35, 0.8, 0.3],
        [23.3, 0.0, 0.0, 0.7, 0.05],
        [26.0, 0.0, 0.0, 0.35, 0.0],
        [27.45, 0.0, 0.0, 0.2, 0.0],
        [27.55, 0.3, 0.9, 0.25, 0.7],
        [31.5, 0.26, 0.85, 0.25, 0.6],
      ];
      function shape(t) {
        if (t <= KEYS[0][0]) return KEYS[0].slice(1);
        for (let i = 1; i < KEYS.length; i++) {
          if (t <= KEYS[i][0]) {
            const a = KEYS[i - 1], b = KEYS[i];
            const f = (t - a[0]) / (b[0] - a[0]);
            return a.slice(1).map((v, k) => v + (b[k + 1] - v) * f);
          }
        }
        return KEYS[KEYS.length - 1].slice(1);
      }

      const canvas = document.getElementById("fire-canvas");
      const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
      const vs = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
      const fs = `
precision highp float;
uniform vec2 res; uniform float t; uniform float H; uniform float heat; uniform float smoke; uniform float ember;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy/res;
  vec2 p = vec2(uv.x*res.x/res.y, uv.y);
  // two layers of rising turbulence, warped sideways so tongues lick and curl
  vec2 q = vec2(fbm(vec2(p.x*3.0, p.y*2.0 - t*1.1)), fbm(vec2(p.x*3.0+5.2, p.y*2.0 - t*1.3)));
  float n  = fbm(vec2(p.x*5.0 + q.x*1.6, p.y*3.2 - t*2.4));
  float n2 = fbm(vec2(p.x*11.0 + q.y*2.0 + 3.0, p.y*7.0 - t*3.8));
  float h = max(H, 0.0001);
  float f = (n*0.8 + n2*0.4)*1.35 - uv.y/h*0.9 - 0.12;
  // fine turbulence inside the body so the core never reads as a flat fill
  float detail = fbm(vec2(p.x*22.0 + q.x*3.0, p.y*14.0 - t*5.5));
  float fire = clamp(f*1.7, 0.0, 1.0) * heat * (0.62 + 0.5*detail);
  fire = clamp(fire, 0.0, 1.0);
  vec3 col = vec3(0.0);
  col = mix(col, vec3(0.42,0.03,0.0), smoothstep(0.0,0.2,fire));
  col = mix(col, vec3(0.95,0.27,0.02), smoothstep(0.15,0.45,fire));
  col = mix(col, vec3(1.0,0.6,0.12), smoothstep(0.4,0.72,fire));
  col = mix(col, vec3(1.0,0.84,0.42), smoothstep(0.68,0.9,fire));
  col = mix(col, vec3(1.0,0.95,0.8), smoothstep(0.92,1.0,fire)*0.7);
  // warm light thrown on the dark surroundings by the flames
  vec3 base = vec3(0.043,0.035,0.032) + vec3(0.32,0.07,0.0)*heat*pow(clamp(1.0-uv.y,0.,1.),2.5)*clamp(h*1.6,0.,1.);
  col = max(col, base);
  // smoke rolls up above the flames and stays after they die
  float s = fbm(vec2(p.x*2.6 + q.x, p.y*1.8 - t*0.45));
  float smk = smoothstep(0.42,0.85,s) * smoke * smoothstep(0.05,0.55,uv.y);
  col = mix(col, vec3(0.2,0.18,0.17), smk*(1.0-fire)*0.85);
  // embers: one candidate per cell, drifting up and sideways, most cells empty
  for (int L=0; L<2; L++){
    float sc = L==0 ? 9.0 : 15.0;
    vec2 g = vec2(p.x*sc + sin(p.y*6.0+t*1.3)*0.35, p.y*sc - t*(L==0?1.6:2.6));
    vec2 id = floor(g);
    float r = hash(id + float(L)*17.0);
    vec2 c = vec2(0.2+0.6*hash(id+3.1), 0.2+0.6*hash(id+7.7));
    float d = length(fract(g)-c);
    float e = smoothstep(L==0?0.07:0.05, 0.0, d) * step(0.86, r) * ember;
    e *= 0.6 + 0.4*sin(t*9.0 + r*40.0);
    col += vec3(1.0,0.55,0.15)*e*(1.0-smoothstep(0.75,1.0,uv.y));
  }
  gl_FragColor = vec4(col,1.0);
}`;
      function sh(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "a");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const U = {};
      ["res", "t", "H", "heat", "smoke", "ember"].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
      gl.uniform2f(U.res, canvas.width, canvas.height);

      function renderAt(time) {
        const [H, heat, smoke, ember] = shape(time);
        gl.uniform1f(U.t, time);
        gl.uniform1f(U.H, H);
        gl.uniform1f(U.heat, heat);
        gl.uniform1f(U.smoke, smoke);
        gl.uniform1f(U.ember, ember);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    })();
  </script>
</template>
